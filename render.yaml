services:
  - type: web
    name: mini-gpt
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -c "from webapp import ensure_checkpoint; print(ensure_checkpoint())"
    startCommand: GRADIO_SERVER_NAME=0.0.0.0 python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      - key: HF_HOME
        value: /opt/render/project/.cache/huggingface
